[project]
name = "keepline"
version = "0.1.0"
description = "Keepline keeps the line of knowledge unbroken when people leave."
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "streamlit>=1.40",
  "altair>=5.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
snowflake = ["snowflake-connector-python>=3.12", "snowflake-snowpark-python>=1.20"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
